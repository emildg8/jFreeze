# Скопируйте в .github/workflows/ci.yml после `gh auth refresh -s workflow`
name: CI

on:
  push:
    branches: [main, master, release/pre-alpha-0.1]
  pull_request:
    branches: [main, master, release/pre-alpha-0.1]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Build
        run: npm run build
